services:
  - type: web
    name: local-service-booking
    runtime: docker
    plan: free
    dockerfilePath: backend/LocalServiceBooking.API/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_DB_CONNECTION_STRING
        sync: false
      - key: JwtSettings__SecretKey
        value: "SecretKeyForLocalServiceBookingApplication2026!"
      - key: JwtSettings__Issuer
        value: "LocalServiceBookingAPI"
      - key: JwtSettings__Audience
        value: "LocalServiceBookingClient"
      - key: PORT
        value: 10000
